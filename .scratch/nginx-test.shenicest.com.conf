# CodingMie staging — 2026-07-09 — 隔离 prod, HTTPS forced
server {
    listen 80;
    server_name test.shenicest.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.shenicest.com;

    ssl_certificate     /etc/letsencrypt/live/test.shenicest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.shenicest.com/privkey.pem;

    access_log /var/log/nginx/codingmie.access.log;
    error_log  /var/log/nginx/codingmie.error.log;

    client_max_body_size 10M;

    include /etc/nginx/snippets/block-sensitive-files.conf;

    # React/Vite SPA 入口重定向到 /platform/
    location = / {
        return 301 /platform/;
    }

    # React 前端构建产物 (Vite base=/platform/)
    location /platform/ {
        alias /home/codingmie/staging/platform/dist/;
        try_files $uri $uri/ /platform/index.html;
    }

    # Product platform API (Bun/Elysia, pm2 :3000)
    location ^~ /product-api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PHP API (base=/platform/api/)
    location /platform/api/ {
        alias /home/codingmie/staging/platform/api/;
        try_files $uri $uri/ =404;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-codingmie.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # 禁止直接访问 .php 非 API 路径
    location ~ \.php$ {
        return 404;
    }
}
